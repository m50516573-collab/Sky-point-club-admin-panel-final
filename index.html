<!-- LOGIN SCREEN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">

        <p class="text-[11px] text-zinc-500 uppercase tracking-widest mt-1">Final Build • Referral Ready</p>
      </div>
    </div>
    <h2 class="text-[22px] font-semibold mb-1">Welcome back</h2>
    <p class="text-sm text-zinc-400 mb-6">Login to manage users & referrals</p>
    <label class="text-[11px] uppercase tracking-widest text-zinc-500">Username</label>
    <input id="loginUser" class="mt-1.5 w-full bg-[#0d0f14] border border-[#232836] rounded-xl px-4 py-3 text-sm outline-none focus:border-zinc-500" value="admin" />
    <label class="text-[11px] uppercase tracking-widest text-zinc-500 mt-4 block">Password</label>
    <input id="loginPass" type="password" class="mt-1.5 w-full bg-[#0d0f14] border border-[#232836] rounded-xl px-4 py-3 text-sm outline-none focus:border-zinc-500" value="admin123" />

    <p id="loginError" class="hidden mt-3 text-[12px] text-red-400 bg-red-400/10 border border-red-400/20 rounded-lg px-3 py-2"></p>
    <p class="mt-6 text-[11px] text-zinc-500 text-center">Demo: admin / admin123</p>
  </div>
</div>

<!-- APP -->
<div id="appScreen" class="hidden min-h-screen flex">
  <!-- Sidebar -->
  <aside class="w-[260px] shrink-0 bg-[#151821] border-r border-[#232836] hidden md:flex flex-col">
    <div class="p-6 border-b border-[#232836] flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-white text-black flex items-center justify-center font-bold">S</div>
      <div><div class="font-bold text-[14px]">Sky Admin</div><div class="text-[10px] text-zinc-500 uppercase tracking-widest">Final v2.0</div></div>
    </div>
    <nav class="p-3 space-y-1">
      <button data-tab="dashboard" class="tab-btn w-full text-left px-3 py-2.5 rounded-xl bg-white text-black text-sm font-medium">Dashboard</button>
      <button data-tab="users" class="tab-btn w-full text-left px-3 py-2.5 rounded-xl text-zinc-400 hover:bg-[#1c2030] text-sm">Users</button>
      <button data-tab="withdrawals" class="tab-btn w-full text-left px-3 py-2.5 rounded-xl text-zinc-400 hover:bg-[#1c2030] text-sm">Withdrawals</button>
      <button data-tab="referrals" class="tab-btn w-full text-left px-3 py-2.5 rounded-xl text-zinc-400 hover:bg-[#1c2030] text-sm">Referrals</button>
      <button data-tab="settings" class="tab-btn w-full text-left px-3 py-2.5 rounded-xl text-zinc-400 hover:bg-[#1c2030] text-sm">Settings</button>
    </nav>
    <div class="mt-auto p-4 border-t border-[#232836]">
      <div class="bg-[#0d0f14] border border-[#232836] rounded-xl p-3">

        <div class="flex items-center gap-2 mt-2"><span class="w-2 h-2 rounded-full bg-emerald-400"></span><span class="text-xs">Connected • onSnapshot live</span></div>
      </div>
      <button onclick="handleLogout()" class="mt-3 w-full text-left px-3 py-2 rounded-xl text-zinc-500 hover:text-white text-sm">Logout</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 min-w-0">

    <div class="md:hidden flex items-center justify-between p-4 border-b border-[#232836] bg-[#151821] sticky top-0 z-20">
      <div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-white text-black flex items-center justify-center font-bold text-sm">S</div><span class="font-semibold">Sky Admin</span></div>

        <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4">

          <div class="bg-[#151821] border border-[#232836] rounded-[16px] p-5"><div class="text-[11px] uppercase tracking-widest text-zinc-500">Active Today</div><div id="kpiActive" class="text-[26px] font-semibold mt-2">0</div><div class="text-[12px] text-emerald-400 mt-1">Live presence</div></div>
          <div class="bg-[#151821] border border-[#232836] rounded-[16px] p-5"><div class="text-[11px] uppercase tracking-widest text-zinc-500">Total Points</div><div id="kpiPoints" class="text-[26px] font-semibold mt-2">0</div><div class="text-[12px] text-zinc-500 mt-1">In circulation</div></div>

          <div class="bg-[#151821] border border-[#232836] rounded-[16px] p-5"><div class="text-[11px] uppercase tracking-widest text-zinc-500">Total Referrals</div><div id="kpiReferrals" class="text-[26px] font-semibold mt-2">0</div><div class="text-[12px] text-zinc-500 mt-1">Collection count</div></div>

<script type="module">
// --- FIREBASE v10 MODULAR IMPORTS ---
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, getDoc, setDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// --- FIREBASE CONFIG (hidden but in code for copying) ---
const firebaseConfig = {
  apiKey: "AIzaSyBXZaME3Z0rd_jsa5LpVG5ZbLpvf6cbu8M",
  authDomain: "aviator-781d9.firebaseapp.com",
  databaseURL: "https://aviator-781d9-default-rtdb.firebaseio.com",
  projectId: "aviator-781d9",
  storageBucket: "aviator-781d9.firebasestorage.app",
  messagingSenderId: "151636540667",
  appId: "1:151636540667:web:a16b6ed543fbf04368c45e",
  measurementId: "G-YB5NK28EK4"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// --- STATE ---
let usersCache = [];
let withdrawCache = [];
let referralCache = [];
let conversion = { points: 10000, pkr: 100 };

// --- LOGIN LOGIC ---
window.handleLogin = () => {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  if(u === 'admin' && p === 'admin123'){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.add('flex');
    initListeners(); // start real-time listeners
  } else {
    const e = document.getElementById('loginError');
    e.textContent = 'Invalid credentials. Use admin / admin123';
    e.classList.remove('hidden');
  }
};
window.handleLogout = () => location.reload();

// --- TAB SWITCHING ---
window.switchTab = (tab) => {
  document.querySelectorAll('[id$="Tab"]').forEach(el=>el.classList.add('hidden'));
  document.getElementById(tab+'Tab').classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b=>{
    if(b.dataset.tab===tab){ b.className='tab-btn w-full text-left px-3 py-2.5 rounded-xl bg-white text-black text-sm font-medium'; }
    else { b.className='tab-btn w-full text-left px-3 py-2.5 rounded-xl text-zinc-400 hover:bg-[#1c2030] text-sm'; }
  });
  const mob = document.getElementById('mobileTab'); if(mob) mob.value = tab;
};
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

// --- FIREBASE REALTIME LISTENERS ---
function initListeners(){
  // Users onSnapshot
  onSnapshot(collection(db, "users"), (snap)=>{
    usersCache = snap.docs.map(d=>({ id: d.id, ...d.data() }));
    renderUsers(); updateKPIs();
  });
  // Withdrawals onSnapshot
  onSnapshot(collection(db, "withdrawals"), (snap)=>{
    withdrawCache = snap.docs.map(d=>({ id: d.id, ...d.data() }));
    renderWithdrawals(); updateKPIs();
  });
  // Referrals onSnapshot
  onSnapshot(collection(db, "referrals"), (snap)=>{
    referralCache = snap.docs.map(d=>({ id: d.id, ...d.data() }));
    renderReferrals(); updateKPIs();
  });
  // Settings
  getDoc(doc(db, "settings", "conversion")).then(s=>{
    if(s.exists()){ conversion = s.data(); document.getElementById('setPoints').value = conversion.points; document.getElementById('setPkr').value = conversion.pkr; }
  });
}

// --- RENDERERS ---
window.renderUsers = () => {
  const q = (document.getElementById('userSearch')?.value || '').toLowerCase();
  const body = document.getElementById('usersBody');
  const filtered = usersCache.filter(u=> (u.name||'').toLowerCase().includes(q) || (u.phone||'').includes(q) || (u.referralCode||'').toLowerCase().includes(q) );
  body.innerHTML = filtered.map(u=>\`
    <tr class="border-b border-[#232836] hover:bg-[#1c2030]/50">
      <td class="p-3 mono text-[12px]">\${u.id}</td>
      <td class="p-3">\${u.name||'-'}</td>
      <td class="p-3 mono">\${u.phone||'-'}</td>
      <td class="p-3 mono font-medium">\${u.points||0}</td>
      <td class="p-3 mono text-[12px]">\${u.referralCode||'-'}</td>
      <td class="p-3 mono text-[12px]">\${u.referredBy||'-'}</td>
      <td class="p-3">\${u.referralCount||0}</td>
      <td class="p-3 mono">\${u.referralEarnings||0}</td>
      <td class="p-3"><span class="px-2 py-1 rounded-full text-[11px] \${u.status==='banned'?'bg-red-500/10 text-red-400 border border-red-500/20':'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}">\${u.status||'active'}</span></td>
      <td class="p-3"><div class="flex gap-1">
        <button onclick="viewUser('\${u.id}')" class="px-2.5 py-1.5 rounded-lg bg-[#232836] text-[11px]">View</button>
        <button onclick="toggleBan('\${u.id}','\${u.status}')" class="px-2.5 py-1.5 rounded-lg bg-[#232836] text-[11px]">\${u.status==='banned'?'Unban':'Ban'}</button>
        <button onclick="addPoints('\${u.id}',1000)" class="px-2.5 py-1.5 rounded-lg bg-white text-black text-[11px] font-medium">+1K</button>
        <button onclick="addPoints('\${u.id}',10000)" class="px-2.5 py-1.5 rounded-lg bg-white text-black text-[11px] font-medium">+10K</button>
      </div></td>
    </tr>\`).join('') || '<tr><td colspan=10 class="p-6 text-center text-zinc-500 text-sm">No users found. Waiting for onSnapshot...</td></tr>';
};

window.renderWithdrawals = () => {
  const body = document.getElementById('withdrawBody');
  body.innerHTML = withdrawCache.map(w=>\`
    <tr class="border-b border-[#232836] hover:bg-[#1c2030]/50">
      <td class="p-3 mono text-[12px]">\${w.userId}</td>
      <td class="p-3 mono">\${w.points}</td>
      <td class="p-3 mono">\${w.pkr||Math.round(w.points/conversion.points*conversion.pkr)}</td>
      <td class="p-3 mono">\${w.easypaisa||'-'}</td>
      <td class="p-3"><span class="px-2 py-1 rounded-full text-[11px] \${w.status==='pending'?'bg-amber-500/10 text-amber-400 border border-amber-500/20':w.status==='approved'?'bg-emerald-500/10 text-emerald-400':'bg-red-500/10 text-red-400'}">\${w.status}</span></td>
      <td class="p-3"><div class="flex gap-1">
        \${w.status==='pending'?\`<button onclick="approveWithdraw('\${w.id}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-500 text-black text-[11px] font-medium">Approve</button><button onclick="rejectWithdraw('\${w.id}','\${w.userId}',\${w.points})" class="px-2.5 py-1.5 rounded-lg bg-[#232836] text-[11px]">Reject</button>\`:'-'}
      </div></td>
    </tr>\`).join('') || '<tr><td colspan=6 class="p-6 text-center text-zinc-500 text-sm">No withdrawals</td></tr>';
};

window.renderReferrals = () => {
  const q = (document.getElementById('refSearch')?.value || '').toLowerCase();
  const body = document.getElementById('refBody');
  const filtered = referralCache.filter(r=> (r.referrerId||'').toLowerCase().includes(q) );
  body.innerHTML = filtered.map(r=>\`
    <tr class="border-b border-[#232836] hover:bg-[#1c2030]/50">
      <td class="p-3 mono text-[12px]">\${r.referrerId}</td>
      <td class="p-3 mono text-[12px]">\${r.referredId}</td>
      <td class="p-3 mono">\${r.points||0}</td>
      <td class="p-3 text-[12px] text-zinc-400">\${r.date||'-'}</td>
    </tr>\`).join('') || '<tr><td colspan=4 class="p-6 text-center text-zinc-500 text-sm">No referrals</td></tr>';
};

// --- ACTIONS ---
window.viewUser = (id)=>{ const u = usersCache.find(x=>x.id===id); alert(JSON.stringify(u,null,2)); };
window.toggleBan = async (id, status)=>{
  const newStatus = status==='banned'?'active':'banned';
  await updateDoc(doc(db,"users",id), { status: newStatus });
};
window.addPoints = async (id, amount)=>{
  // Add points using increment
  await updateDoc(doc(db,"users",id), { points: increment(amount) });
};
window.approveWithdraw = async (id)=>{
  await updateDoc(doc(db,"withdrawals",id), { status: 'approved' });
};
window.rejectWithdraw = async (id, userId, points)=>{
  await updateDoc(doc(db,"withdrawals",id), { status: 'rejected' });
  // return points if rejected
  await updateDoc(doc(db,"users",userId), { points: increment(points) });
};
window.saveSettings = async ()=>{
  const p = parseInt(document.getElementById('setPoints').value)||10000;
  const k = parseInt(document.getElementById('setPkr').value)||100;
  await setDoc(doc(db,"settings","conversion"), { points: p, pkr: k });
  const s = document.getElementById('settingsStatus');
  s.textContent = 'Saved ✓ Conversion updated';
  s.className = 'text-xs px-3 py-2 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
  s.classList.remove('hidden');
};
function updateKPIs(){
  document.getElementById('kpiUsers').textContent = usersCache.length;
  document.getElementById('kpiActive').textContent = usersCache.filter(u=>u.status==='active').length;
  document.getElementById('kpiPoints').textContent = usersCache.reduce((a,b)=>a+(b.points||0),0).toLocaleString();
  document.getElementById('kpiPending').textContent = withdrawCache.filter(w=>w.status==='pending').length;
  document.getElementById('kpiReferrals').textContent = referralCache.length;
  document.getElementById('kpiRefEarn').textContent = usersCache.reduce((a,b)=>a+(b.referralEarnings||0),0).toLocaleString() + ' PTS';
}
window.loadUsers = ()=>{ /* onSnapshot already live */ };
<\/script>
</body>
