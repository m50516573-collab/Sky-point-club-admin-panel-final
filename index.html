<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-2xl w-full max-w-sm shadow"><h1 class="text-2xl font-bold mb-6 text-center">Sky Admin Login</h1><input id="u" placeholder="Username" class="w-full p-3 border rounded-xl mb-3"><input id="p" type="password" placeholder="Password" class="w-full p-3 border rounded-xl mb-4"><button onclick="login()" class="w-full bg-black text-white p-3 rounded-xl">Login</button><p class="text-xs text-center mt-3 text-gray-500">admin / admin123</p></div>
</div>
<div id="panel" class="hidden">
  <div class="bg-black text-white p-4 flex justify-between"><h1 class="font-bold">Sky Points - Admin Panel</h1><button onclick="location.reload()" class="text-xs bg-white/20 px-3 py-1 rounded">Logout</button></div>
  <div class="p-4 grid grid-cols-2 md:grid-cols-4 gap-4" id="kpis"></div>
  <div class="p-4">
    <div class="flex gap-2 mb-4"><button onclick="load('users')" class="bg-black text-white px-4 py-2 rounded">Users</button><button onclick="load('withdrawals')" class="bg-white border px-4 py-2 rounded">Withdrawals</button><button onclick="load('referrals')" class="bg-white border px-4 py-2 rounded">Referrals</button></div>
    <div class="bg-white rounded-xl p-4 overflow-auto" id="table"></div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, increment, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyBXZaME3Z0rd_jsa5LpVG5ZbLpvf6cbu8M", authDomain: "aviator-781d9.firebaseapp.com", projectId: "aviator-781d9", storageBucket: "aviator-781d9.firebasestorage.app", messagingSenderId: "151636540667", appId: "1:151636540667:web:a16b6ed543fbf04368c45e" };
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
window.login=()=>{if(document.getElementById('u').value=='admin'&&document.getElementById('p').value=='admin123'){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');init()}else alert('Wrong')}
let allUsers=[];
function init(){
  onSnapshot(collection(db,'users'),(snap)=>{
    allUsers=snap.docs.map(d=>({id:d.id,...d.data()}));
    document.getElementById('kpis').innerHTML=`<div class="bg-white p-4 rounded-xl"><p class="text-xs">Total Users</p><p class="text-2xl font-bold">${allUsers.length}</p></div><div class="bg-white p-4 rounded-xl"><p class="text-xs">Total Points</p><p class="text-2xl font-bold">${allUsers.reduce((s,u)=>s+(u.points||0),0)}</p></div><div class="bg-white p-4 rounded-xl"><p class="text-xs">Referrals</p><p class="text-2xl font-bold">${allUsers.reduce((s,u)=>s+(u.referralCount||0),0)}</p></div><div class="bg-white p-4 rounded-xl"><p class="text-xs">Pending Withdraw</p><p class="text-2xl font-bold" id="pend">...</p></div>`;
    load('users');
  });
  onSnapshot(collection(db,'withdrawals'),(snap)=>{
    document.getElementById('pend').innerText=snap.docs.filter(d=>d.data().status=='pending').length;
  });
}
window.load=async(type)=>{
  const tbl=document.getElementById('table');
  if(type=='users'){
    tbl.innerHTML=`<h2 class="font-bold mb-3">Users - ${allUsers.length}</h2><div class="overflow-auto"><table class="w-full text-xs"><tr class="bg-gray-100"><th class="p-2 text-left">UserID</th><th>Name</th><th>Phone</th><th>Points</th><th>Ref Code</th><th>Referred By</th><th>Ref Count</th><th>Ref Earn</th><th>Action</th></tr>${allUsers.map(u=>`<tr class="border-b"><td class="p-2">${u.userId}</td><td>${u.name}</td><td>${u.phone}</td><td class="font-bold">${u.points}</td><td>${u.referralCode||u.userId}</td><td>${u.referredBy||'-'}</td><td>${u.referralCount||0}</td><td>${u.referralEarnings||0}</td><td class="flex gap-1 p-1"><button onclick="addPts('${u.id}',1000)" class="bg-green-600 text-white px-2 py-1 rounded">+1k</button><button onclick="addPts('${u.id}',10000)" class="bg-blue-600 text-white px-2 py-1 rounded">+10k</button></td></tr>`).join('')}</table></div>`;
  } else if(type=='withdrawals'){
    const snap=await getDocs(collection(db,'withdrawals'));
    const list=snap.docs.map(d=>({id:d.id,...d.data()})).reverse();
    tbl.innerHTML=`<h2 class="font-bold mb-3">Withdrawals - ${list.length}</h2><table class="w-full text-xs"><tr class="bg-gray-100"><th class="p-2">UserID</th><th>Points</th><th>PKR</th><th>Easypaisa</th><th>Status</th><th>Action</th></tr>${list.map(w=>`<tr class="border-b"><td class="p-2">${w.userId}</td><td>${w.points}</td><td>${w.pkr}</td><td>${w.easypaisa}</td><td>${w.status}</td><td>${w.status=='pending'?`<button onclick="approve('${w.id}')" class="bg-green-600 text-white px-2 py-1 rounded">Approve</button> <button onclick="reject('${w.id}','${w.userId}',${w.points})" class="bg-red-600 text-white px-2 py-1 rounded">Reject</button>`:w.status}</td></tr>`).join('')}</table>`;
  } else if(type=='referrals'){
    const snap=await getDocs(collection(db,'referrals'));
    const list=snap.docs.map(d=>d.data());
    tbl.innerHTML=`<h2 class="font-bold mb-3">Referrals - ${list.length}</h2><table class="w-full text-xs"><tr class="bg-gray-100"><th class="p-2">Referrer</th><th>Referred</th><th>Points</th><th>Date</th></tr>${list.map(r=>`<tr class="border-b"><td class="p-2">${r.referrerId}</td><td>${r.referredId}</td><td>${r.points}</td><td>${new Date(r.createdAt).toLocaleString()}</td></tr>`).join('')}</table>`;
  }
}
window.addPts=async(id,pts)=>{await updateDoc(doc(db,'users',id),{points:increment(pts)});alert(pts+' added')}
window.approve=async(id)=>{await updateDoc(doc(db,'withdrawals',id),{status:'approved'});alert('Approved')}
window.reject=async(id,userId,pts)=>{await updateDoc(doc(db,'withdrawals',id),{status:'rejected'});await updateDoc(doc(db,'users',userId),{points:increment(pts)});alert('Rejected & points returned')}
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
